<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans, sans-serif); }
  body { background: #f0f4f8; }
  .portal-bg {
    min-height: 100vh;
    background: linear-gradient(180deg, #f5f8ff 15%, #2563eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 32px 0 rgba(37,99,235,0.10);
    padding: 50px 54px 46px;
    min-width: 320px;
    max-width: 380px;
    width: 100%;
    position: relative;
    z-index: 2;
  }
  .card h2 {
    font-size: 18px;
    font-weight: 600;
    color: #1e293b;
    text-align: center;
    margin-bottom: 6px;
  }
  .card .subtitle {
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 28px;
  }
  .role-grid {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .role-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px 18px;
    border-radius: 14px;
    transition: background 0.15s;
  }
  .role-btn:hover { background: #eff6ff; }
  .role-btn.selected { background: #dbeafe; }
  .role-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0eaff;
    overflow: hidden;
  }
  .role-btn.doctor .role-avatar { background: #dbeafe; }
  .role-btn.patient .role-avatar { background: #fde8d8; }
  .role-label {
    font-size: 13px;
    color: #475569;
    font-weight: 500;
  }

  /* Login card */
  .login-card { display: none; }
  .login-card.active { display: block; }
  .selection-card.hidden { display: none; }

  .back-btn {
    background: none;
    border: none;
    color: #2563eb;
    font-size: 20px;
    cursor: pointer;
    position: absolute;
    top: 16px;
    left: 18px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .back-btn:hover { background: #eff6ff; }
  .help-btn {
    background: none;
    border: none;
    color: #2563eb;
    font-size: 18px;
    cursor: pointer;
    position: absolute;
    top: 16px;
    right: 18px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #2563eb;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
  }
  .login-greeting {
    text-align: center;
    margin-bottom: 22px;
    margin-top: 8px;
  }
  .login-greeting .hi {
    font-size: 14px;
    color: #64748b;
  }
  .login-greeting .prompt {
    font-size: 13px;
    color: #94a3b8;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .input-wrap input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid #e2e8f0;
    padding: 10px 36px 10px 4px;
    font-size: 14px;
    color: #1e293b;
    background: transparent;
    outline: none;
    border-radius: 0;
    transition: border-color 0.15s;
  }
  .input-wrap input:focus { border-bottom-color: #2563eb; }
  .input-wrap input::placeholder { color: #cbd5e1; }
  .input-icon {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
  }
  .enter-btn {
    width: 100%;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.15s;
  }
  .enter-btn:hover { background: #2563eb; }
  .enter-btn:active { background: #1d4ed8; }
  .error-msg {
    color: #ef4444;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
    min-height: 18px;
  }
  .success-card {
    display: none;
    text-align: center;
    padding: 16px 0 8px;
  }
  .success-card .tick {
    width: 56px; height: 56px;
    background: #dcfce7;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
    font-size: 28px;
  }
  .success-card h3 { font-size: 18px; color: #16a34a; margin-bottom: 6px; }
  .success-card p { font-size: 13px; color: #64748b; }
  .logout-btn {
    margin-top: 16px;
    background: none;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 13px;
    color: #475569;
    cursor: pointer;
  }
  .logout-btn:hover { background: #f8fafc; }
</style>

<script>
let currentRole = '';

function selectRole(role) {
  currentRole = role;
  document.getElementById('selectionCard').classList.add('hidden');
  document.getElementById('loginCard').classList.add('active');
  const greet = role === 'doctor' ? 'Hello, Doctor!' : 'Hello, Patient!';
  document.getElementById('greetingHi').textContent = greet;
  const placeholder = role === 'doctor' ? 'CRM' : 'CPF / Login';
  document.getElementById('usernameInput').placeholder = placeholder;
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('usernameInput').value = '';
  document.getElementById('passwordInput').value = '';
}

function goBack() {
  document.getElementById('selectionCard').classList.remove('hidden');
  document.getElementById('loginCard').classList.remove('active');
  document.getElementById('loginForm').style.display = '';
  document.getElementById('successCard').style.display = 'none';
}

function togglePwd() {
  const inp = document.getElementById('passwordInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function doLogin() {
  const user = document.getElementById('usernameInput').value.trim();
  const pass = document.getElementById('passwordInput').value.trim();
  const err = document.getElementById('errorMsg');

  if (!user || !pass) { 
    err.textContent = 'Aiyo Iyer Wrong Password or Username. Try again!'; 
    return; 
  }

  // DOCTOR LOGIN
  if (currentRole === 'doctor') {
    if (user === 'admin' && pass === 'admin') {
      localStorage.setItem("role", "doctor");
      window.location.href = "patient_selector.html";
    } else {
      err.textContent = 'Invalid Doctor Credentials';
    }
  } 
  
  // PATIENT LOGIN
  else if (currentRole === 'patient') {
    const patients = [
      { name: 'Aarav', pass: '123', id: 'P-101' },
      { name: 'Priya', pass: '123', id: 'P-102' },
      { name: 'Rajan', pass: '123', id: 'P-103' }
    ];
    
    const match = patients.find(p => p.name.toLowerCase() === user.toLowerCase() && p.pass === pass);
    
    if (match) {
      localStorage.setItem("role", "patient");
      localStorage.setItem("selectedPatient", JSON.stringify({ id: match.id, name: match.name }));
      window.location.href = "patient_form.html";
    } else {
      err.textContent = 'Invalid Patient Credentials';
    }
  }
}
 
function doLogout() {
  goBack();
}

document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('usernameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
